[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-core"
version = "2.0.0"
description = "Echo-Core Incident Response Agent with Persistent Memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "hindsight-client>=1.2.0",
    "groq>=1.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
